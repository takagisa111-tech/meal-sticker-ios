# 一键部署「管家」后端到 Render（免费实例，新加坡）
services:
  - type: web
    name: shitie-butler
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    buildCommand: pip install -r requirements-server.txt && python -c "from mealagent.knowledge import recipes; print(len(recipes.load()), 'recipes')"
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BUTLER_DENSE
        value: "0"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: APP_TOKEN
        generateValue: true
